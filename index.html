<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision Ads - Digital Billboard Inquiry</title>
  <!-- Tailwind CSS CDN for modern design -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 font-sans">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-slate-200">
      
      <!-- Header Section -->
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-800">Vision Ads</h1>
        <p class="text-sm text-slate-500 mt-1">Digital Billboard & Advertising Service</p>
      </div>

      <!-- Form -->
      <form id="visionForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">আপনার দোকানের নাম (Shop Name)</label>
          <input type="text" id="shopName" required
            class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800"
            placeholder="আপনার দোকানের নাম লিখুন">
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">মালিকের নাম (Owner Name)</label>
          <input type="text" id="ownerName" required
            class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800"
            placeholder="আপনার পুরো নাম লিখুন">
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">মোবাইল নম্বর (Phone Number)</label>
          <input type="tel" id="phone" required
            class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800"
            placeholder="১০ বা ১১ ডিজিটের মোবাইল নম্বর">
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">ব্যবসার ঠিকানা (Business Address)</label>
          <textarea id="address" rows="2" required
            class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800"
            placeholder="দোকানের ঠিকানা বা বাজার/এলাকার নাম"></textarea>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">বিজ্ঞাপনের বিবরণ (Requirements)</label>
          <textarea id="requirements" rows="3" required
            class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800"
            placeholder="আপনার ad বা দরকার সম্পর্কে কিছু লিখুন..."></textarea>
        </div>

        <button type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-blue-500/30">
          Submit Now
        </button>
      </form>

      <div id="status" class="mt-4 text-center text-sm font-semibold"></div>

      <!-- ABOUT US SECTION (Live data from Supabase) -->
      <div class="mt-8 pt-6 border-t border-dashed border-slate-300 text-center" id="about-section">
        <img id="dbLogo" src="https://via.placeholder.com/80" alt="Logo" class="w-16 h-16 mx-auto rounded-full object-cover mb-2 border border-slate-200 shadow-sm">
        <h3 id="dbBusinessName" class="font-bold text-lg text-slate-800">Vision Ads</h3>
        <p class="text-xs text-slate-500 mt-1">ঠিকানা: <span id="dbAddress">Loading...</span></p>
        <p class="text-xs text-slate-500 mt-0.5">Contact: <span id="dbEmail">...</span> | <span id="dbPhone">...</span></p>
        <p id="dbDesc" class="text-xs text-slate-600 mt-2 px-2"></p>
      </div>

    </div>
  </div>

  <script>
    // CONFIGURATION
    const SUPABASE_URL = 'https://dvlcqxcygzfbkpqjtkbd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_4-Vjjs37LSUvOX1jK6qMJA_33KuW0V9';
    
    const BOT_TOKEN = '8829996475:AAG3mLis5EQ6nVKRUcXP1pcTSc_JewixmO0';
    const CHAT_ID = '-1004417668033';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Load About Us Info from Supabase on Page Load
    async function loadAboutUs() {
      try {
        const { data, error } = await supabaseClient.from('settings').select('*').eq('id', 1).single();
        if (data) {
          document.getElementById('dbBusinessName').innerText = data.business_name || 'Vision Ads';
          document.getElementById('dbAddress').innerText = data.address || '';
          document.getElementById('dbPhone').innerText = data.phone || '';
          document.getElementById('dbEmail').innerText = data.email || '';
          document.getElementById('dbDesc').innerText = data.description || '';
          if (data.logo_url) {
            document.getElementById('dbLogo').src = data.logo_url;
          }
        }
      } catch (err) {
        console.error('Error loading settings:', err);
      }
    }

    loadAboutUs();

    // Form Submit to Telegram
    document.getElementById('visionForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = 'Sending...';
      statusDiv.className = 'mt-4 text-center text-sm font-semibold text-blue-600';

      const shopName = document.getElementById('shopName').value;
      const ownerName = document.getElementById('ownerName').value;
      const phone = document.getElementById('phone').value;
      const address = document.getElementById('address').value;
      const requirements = document.getElementById('requirements').value;

      const message = `🚀 New Vision Ads Inquiry!\n\n` +
                      `🏪 Shop: ${shopName}\n` +
                      `👤 Owner: ${ownerName}\n` +
                      `📞 Phone: ${phone}\n` +
                      `📍 Address: ${address}\n` +
                      `💬 Details: ${requirements}`;

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: message
          })
        });

        if (response.ok) {
          statusDiv.innerText = 'Successfully submitted! We will contact you soon.';
          statusDiv.className = 'mt-4 text-center text-sm font-semibold text-green-600';
          document.getElementById('visionForm').reset();
        } else {
          throw new Error('Failed to send message via Telegram');
        }
      } catch (err) {
        statusDiv.innerText = 'Error sending message. Please try again.';
        statusDiv.className = 'mt-4 text-center text-sm font-semibold text-red-600';
      }
    });
  </script>
</body>
</html>
