<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision Ads - Digital Billboard Inquiry</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts: Hind Siliguri -->
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Hind Siliguri', sans-serif;
      background: linear-gradient(135deg, #fffaf5 0%, #fff2e6 100%);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between py-6 px-4">

  <!-- Top Header Navigation -->
  <div class="max-w-md mx-auto w-full flex justify-between items-center mb-6 px-2">
    <div>
      <span class="text-2xl font-bold text-gray-900 tracking-wide">Vision Ads</span>
    </div>
    <div>
      <span class="bg-orange-100 text-orange-700 text-xs font-semibold px-3 py-1.5 rounded-full shadow-sm">✨ ডিজিটাল বিলবোর্ড</span>
    </div>
  </div>

  <!-- Main Container Card -->
  <div class="max-w-md mx-auto w-full bg-white rounded-3xl shadow-xl p-6 md:p-8 border border-orange-100">
    
    <!-- Header Section inside card -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-900">বিজ্ঞাপন বুকিং ফর্ম</h1>
      <p class="text-sm text-orange-600 font-medium mt-1">Digital Billboard & Advertising Service</p>
    </div>

    <!-- Form -->
    <form id="visionForm" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">আপনার দোকানের নাম (Shop Name)</label>
        <input type="text" id="shopName" required
          class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none text-gray-800 transition"
          placeholder="আপনার দোকানের নাম লিখুন">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">মালিকের নাম (Owner Name)</label>
        <input type="text" id="ownerName" required
          class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none text-gray-800 transition"
          placeholder="আপনার পুরো নাম লিখুন">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">মোবাইল নম্বর (Phone Number)</label>
        <input type="tel" id="phone" required
          class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none text-gray-800 transition"
          placeholder="১০ বা ১১ ডিজিটের মোবাইল নম্বর">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">ব্যবসার ঠিকানা (Business Address)</label>
        <textarea id="address" rows="2" required
          class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none text-gray-800 resize-none transition"
          placeholder="দোকানের ঠিকানা বা বাজার/এলাকার নাম"></textarea>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">বিজ্ঞাপনের বিবরণ (Requirements)</label>
        <textarea id="requirements" rows="3" required
          class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none text-gray-800 resize-none transition"
          placeholder="আপনার ad বা দরকার সম্পর্কে কিছু লিখুন..."></textarea>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-orange-500/30 transform active:scale-95">
        Submit Now
      </button>
    </form>

    <div id="status" class="mt-4 text-center text-sm font-semibold"></div>

    <!-- ABOUT US SECTION -->
    <div class="mt-8 pt-6 border-t border-dashed border-orange-200 text-center" id="about-section">
      <img id="dbLogo" src="https://via.placeholder.com/80" alt="Logo" class="w-16 h-16 mx-auto rounded-full object-cover mb-2 border border-orange-200 shadow-sm">
      <h3 id="dbBusinessName" class="font-bold text-lg text-gray-900">Vision Ads</h3>
      <p class="text-xs text-gray-600 mt-1">ঠিকানা: <span id="dbAddress">Loading...</span></p>
      <p class="text-xs text-gray-600 mt-0.5">Contact: <span id="dbEmail">...</span> | <span id="dbPhone">...</span></p>
      <p id="dbDesc" class="text-xs text-gray-600 mt-2 px-2"></p>
    </div>

  </div>

  <!-- Footer -->
  <footer class="mt-8 text-center text-xs text-gray-500">
    © 2026 Vision Ads — সর্বস্বত্ব সংরক্ষিত
  </footer>

  <script>
    const SUPABASE_URL = 'https://dvlcqxcygzfbkpqjtkbd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_4-Vjjs37LSUvOX1jK6qMJA_33KuW0V9';
    
    const BOT_TOKEN = '8829996475:AAG3mLis5EQ6nVKRUcXP1pcTSc_JewixmO0';
    const CHAT_ID = '-1004417668033';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadAboutUs() {
      try {
        const { data } = await supabaseClient.from('settings').select('*').eq('id', 1).single();
        if (data) {
          document.getElementById('dbBusinessName').innerText = data.business_name || 'Vision Ads';
          document.getElementById('dbAddress').innerText = data.address || '';
          document.getElementById('dbPhone').innerText = data.phone || '';
          document.getElementById('dbEmail').innerText = data.email || '';
          document.getElementById('dbDesc').innerText = data.description || '';
          if (data.logo_url) document.getElementById('dbLogo').src = data.logo_url;
        }
      } catch (err) {
        console.error('Error loading settings:', err);
      }
    }

    loadAboutUs();

    document.getElementById('visionForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const statusDiv = document.getElementById('status');
      
      submitBtn.innerText = 'Submitting...';
      submitBtn.disabled = true;
      statusDiv.innerText = '';

      const shopName = document.getElementById('shopName').value;
      const ownerName = document.getElementById('ownerName').value;
      const phone = document.getElementById('phone').value;
      const address = document.getElementById('address').value;
      const requirements = document.getElementById('requirements').value;

      let dbErrorMsg = "";
      let tgErrorMsg = "";

      // 1. Supabase Insert
      try {
        const { error: dbError } = await supabaseClient
          .from('vision_ads')
          .insert([{ 
            shop_name: shopName, 
            owner_name: ownerName, 
            phone_number: phone, 
            business_address: address, 
            requirements: requirements 
          }]);

        if (dbError) {
          dbErrorMsg = dbError.message;
        }
      } catch (err) {
        dbErrorMsg = err.message;
      }

      // 2. Telegram Send
      try {
        const message = `🚀 New Vision Ads Inquiry!\n\n` +
                        `🏪 Shop: ${shopName}\n` +
                        `👤 Owner: ${ownerName}\n` +
                        `📞 Phone: ${phone}\n` +
                        `📍 Address: ${address}\n` +
                        `💬 Details: ${requirements}`;

        const tgRes = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: CHAT_ID, text: message })
        });

        if (!tgRes.ok) {
          const tgText = await tgRes.text();
          tgErrorMsg = `Telegram: ${tgText}`;
        }
      } catch (err) {
        tgErrorMsg = `Telegram Exception: ${err.message}`;
      }

      // Display Result / Exact Error
      if (!dbErrorMsg && !tgErrorMsg) {
        statusDiv.innerText = '✅ সফলভাবে সাবমিট হয়েছে!';
        statusDiv.className = 'mt-4 text-center text-sm font-semibold text-green-600 bg-green-50 p-2.5 rounded-xl border border-green-200';
        document.getElementById('visionForm').reset();
      } else {
        let fullError = "";
        if (dbErrorMsg) fullError += `DB Error: ${dbErrorMsg} `;
        if (tgErrorMsg) fullError += tgErrorMsg;

        statusDiv.innerText = '❌ ' + fullError;
        statusDiv.className = 'mt-4 text-center text-xs font-semibold text-red-600 bg-red-50 p-2.5 rounded-xl border border-red-200 overflow-x-auto';
      }

      submitBtn.innerText = 'Submit Now';
      submitBtn.disabled = false;
    });
  </script>
</body>
</html>
