<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Ads - Digital Billboard Inquiry</title>
    <!-- Tailwind CSS CDN for modern design -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-slate-200">
            
            <!-- Header Section -->
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-slate-800">Vision Ads</h1>
                <p class="text-sm text-slate-500 mt-1">Digital Billboard & Advertising Service</p>
            </div>
            
            <!-- Form -->
            <form id="visionForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">দোকানের বা ব্যবসার নাম (Shop Name)</label>
                    <input type="text" id="shopName" required 
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800" 
                        placeholder="আপনার দোকানের নাম লিখুন">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">মালিকের নাম (Owner Name)</label>
                    <input type="text" id="ownerName" required 
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800" 
                        placeholder="আপনার পুরো নাম লিখুন">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">মোবাইল নম্বর (Phone Number)</label>
                    <input type="tel" id="phone" required 
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800" 
                        placeholder="১০ বা ১১ ডিজিটের মোবাইল নম্বর">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">দোকানের ঠিকানা (Business Address)</label>
                    <textarea id="address" rows="2" required 
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800" 
                        placeholder="দোকানের লোকেশন বা বাজার/এলাকার নাম"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">বিজ্ঞাপনের বিবরণ / প্যাকেজ (Requirements)</label>
                    <textarea id="requirements" rows="3" 
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-slate-800" 
                        placeholder="কী ধরনের বিজ্ঞাপন বা কতদিনের জন্য চালাতে চান লিখুন"></textarea>
                </div>

                <button type="submit" id="submitBtn" 
                    class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition duration-200 shadow-md">
                    তথ্য জমা দিন (Submit)
                </button>
            </form>

            <!-- Status Message Box -->
            <div id="statusMessage" class="mt-4 text-center text-sm font-semibold hidden"></div>
        </div>
    </div>

    <script>
        // Telegram Bot Credentials Configured
        const BOT_TOKEN = '8829996475:AAG3mLis5EQ6nVKRUcXP1pcTSc_JewixmO0';   
        const CHAT_ID = '-1004417668033';         

        document.getElementById('visionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('statusMessage');
            
            const shopName = document.getElementById('shopName').value;
            const ownerName = document.getElementById('ownerName').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const requirements = document.getElementById('requirements').value;

            const message = `📢 *Vision Ads New Client Inquiry*\n\n` +
                            `🏬 *Shop Name:* ${shopName}\n` +
                            `👤 *Owner:* ${ownerName}\n` +
                            `📞 *Phone:* ${phone}\n` +
                            `📍 *Address:* ${address}\n` +
                            `📝 *Requirements:* ${requirements || 'N/A'}`;

            submitBtn.disabled = true;
            submitBtn.textContent = 'পাঠানো হচ্ছে...';
            statusMessage.classList.add('hidden');

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    statusMessage.textContent = 'ধন্যবাদ! আপনার তথ্য সফলভাবে জমা হয়েছে।';
                    statusMessage.className = 'mt-4 text-center text-sm font-semibold text-green-600';
                    statusMessage.classList.remove('hidden');
                    document.getElementById('visionForm').reset();
                } else {
                    throw new Error('Telegram API Error');
                }
            } catch (error) {
                statusMessage.textContent = 'দুঃখিত, সার্ভারে সমস্যা হয়েছে। আবার চেষ্টা করুন।';
                statusMessage.className = 'mt-4 text-center text-sm font-semibold text-red-600';
                statusMessage.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'তথ্য জমা দিন (Submit)';
            }
        });
    </script>
</body>
</html>
