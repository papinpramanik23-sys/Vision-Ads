<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Ads - Digital Advertising Platform</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa, #c3cfe2); color: #333; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        input:focus, textarea:focus { border-color: #1a73e8; outline: none; }
        button { width: 100%; background: #1a73e8; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #1557b0; }
        #status { text-align: center; margin-top: 15px; font-size: 14px; font-weight: bold; }
        
        /* ABOUT US SECTION */
        .about-section { margin-top: 30px; padding-top: 20px; border-top: 2px dashed #ddd; text-align: center; }
        .about-section img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 2px solid #1a73e8; }
        .about-section h3 { color: #333; margin-bottom: 5px; font-size: 18px; }
        .about-section p { font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Vision Ads Registration</h2>
        
        <form id="adForm">
            <div class="form-group">
                <label for="name">Apnar Nam:</label>
                <input type="text" id="name" required placeholder="Apnar purono nam likhun">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" required placeholder="10 digiter mobile number">
            </div>
            <div class="form-group">
                <label for="business">Business / Company Nam:</label>
                <input type="text" id="business" required placeholder="Apnar business-er nam">
            </div>
            <div class="form-group">
                <label for="message">Details / Message:</label>
                <textarea id="message" rows="3" placeholder="Apnar ad ba darkar somporke kichu likhun..."></textarea>
            </div>
            <button type="submit">Submit Now</button>
        </form>

        <div id="status"></div>

        <!-- ABOUT US SECTION (Live data from Supabase) -->
        <div class="about-section">
            <img src="https://via.placeholder.com/80" alt="Logo" id="dbLogo">
            <h3 id="dbBusinessName">Vision Ads</h3>
            <p><b>Thikana:</b> <span id="dbAddress">Loading...</span></p>
            <p><b>Contact:</b> <span id="dbEmail">...</span> | <span id="dbPhone">...</span></p>
            <p id="dbDesc">...</p>
        </div>
    </div>

    <script>
        // CONFIGURATION (Injected Automatically)
        const SUPABASE_URL = 'https://dvlcqxcygzfbkpqjtkbd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_4-Vjjs37LSUvOX1jK6qMJA_33KuW0V9';
        
        const BOT_TOKEN = "8829996475:AAG3mLis5EQ6nVKRUcXP1pcTSc_JewixmO0"; 
        const CHAT_ID = "-1004417668033";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Load About Us Info from Supabase on Page Load
        async function loadAboutUs() {
            try {
                const { data, error } = await supabaseClient.from('settings').select('*').eq('id', 1).single();
                if(data) {
                    document.getElementById('dbBusinessName').innerText = data.business_name;
                    document.getElementById('dbAddress').innerText = data.address;
                    document.getElementById('dbPhone').innerText = data.phone;
                    document.getElementById('dbEmail').innerText = data.email;
                    document.getElementById('dbDesc').innerText = data.description;
                    if(data.logo_url) document.getElementById('dbLogo').src = data.logo_url;
                }
            } catch (err) {
                console.log("Data load error:", err);
            }
        }
        loadAboutUs();

        // Form Submit to Telegram
        document.getElementById('adForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const business = document.getElementById('business').value;
            const message = document.getElementById('message').value;
            const statusDiv = document.getElementById('status');

            statusDiv.style.color = "#1a73e8";
            statusDiv.innerText = "Submitting...";

            const text = `📢 New Vision Ads Registration:\n\n👤 Nam: ${name}\n📞 Phone: ${phone}\n🏢 Business: ${business}\n💬 Details: ${message}`;
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;

            fetch(url).then(res => res.json()).then(data => {
                if(data.ok) {
                    statusDiv.style.color = "green";
                    statusDiv.innerText = "Successfully Submitted! Telegram e message chole geche.";
                    document.getElementById('adForm').reset();
                } else {
                    statusDiv.style.color = "red";
                    statusDiv.innerText = "Somossa hoyeche, abar chesta korun.";
                }
            }).catch(() => {
                statusDiv.style.color = "red";
                statusDiv.innerText = "Network Error!";
            });
        });
    </script>
</body>
</html>
